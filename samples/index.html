<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ad Samples · Owen Belen</title>
<link rel="icon" href="../favicon.svg">
<style>
  :root { --bg: #0e0f12; --card: #17191e; --text: #f2f2f0; --muted: #a2a6ae; --line: #2a2d34; --accent: #ff5a36; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.1; margin: 0 0 8px; letter-spacing: -0.02em; }
  .lead { color: var(--muted); margin: 0 0 36px; max-width: 60ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  video { display: block; width: 100%; aspect-ratio: 9 / 16; background: #000; }
  figcaption { padding: 16px 18px 18px; }
  .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
  h2 { font-size: 20px; margin: 0 0 6px; }
  figcaption p { margin: 0; color: var(--muted); font-size: 15px; }
  .more { margin-top: 36px; color: var(--muted); }
  a { color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>Ad samples</h1>
  <p class="lead">Two short vertical ad samples by Owen Belen. Most of my AI ad work is for a current client and can't be shared publicly, so I'm happy to walk through my full workflow live on a call.</p>
  <div class="grid">
    <figure id="ai-ugc-ad">
      <video src="ai-ugc-ad.mp4" poster="ai-ugc-ad.jpg" controls playsinline preload="metadata"></video>
      <figcaption>
        <p class="label">AI UGC ad · 9:16 · 0:21</p>
        <h2>Seat cushion, fully AI-generated</h2>
        <p>An AI creator compares four cushions and lands on ours. Every scene is generated from the real product photos, so the cushion looks the same in every shot. AI voice and sound. Watermarked test sample.</p>
      </figcaption>
    </figure>
    <figure id="product-ad">
      <video src="product-ad.mp4" poster="product-ad.jpg" controls playsinline preload="metadata"></video>
      <figcaption>
        <p class="label">Product ad · 9:16 · 0:15</p>
        <h2>Car seat cover, direct response edit</h2>
        <p>A fast product ad cut from raw footage: a hook in the first second, benefit captions, and a clear call to action at the end.</p>
      </figcaption>
    </figure>
  </div>
  <p class="more">More of my video work: <a href="https://carlowenbelen.github.io/#reel">carlowenbelen.github.io</a></p>
</main>
</body>
</html>
